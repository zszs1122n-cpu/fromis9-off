# 매일 오전 9시(KST)에 영상 캘린더와 필굿의 갤러리 원문을 확인한다.
name: 오프 일정 동기화

on:
  schedule:
    - cron: "0 0 * * *"   # UTC 00:00 = KST 09:00
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 일정 가져오기
        env:
          OFF_OUT: docs/events.json
        run: |
          python -m pip install -r requirements.txt
          python -m unittest -q test_gallery
          python sync.py
      - name: 바뀐 일정 저장
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/events.json
          git diff --cached --quiet || git commit -m "캘린더 동기화 $(TZ=Asia/Seoul date +%F)"
          git push
